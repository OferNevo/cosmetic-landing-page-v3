<body class="page">
    <main id="content" class="section container">
        <div class="actions-bar">
            <a class="btn btn-techelet-outline" href="index.html">← חזרה לדף הראשי</a>
            <h1 style="margin:0;">דשבורד הזמנות</h1>
            <span id="ep" class="badge muted" title="Endpoint in use"></span>
            <span id="ping" class="badge muted" title="Server status"></span>
        </div>
        <p class="muted">הדשבורד קורא ב-GET אל שרת ה-Apps Script (Reader) ומציג נתונים כפי שנרשמו ב-Google Sheets.</p>

        <!-- Filters -->
        <div class="filters">
            <div class="field">
                <label for="from">מתאריך (YYYY-MM-DD)</label>
                <input id="from" type="date" />
            </div>
            <div class="field">
                <label for="to">עד תאריך (YYYY-MM-DD)</label>
                <input id="to" type="date" />
            </div>
            <div class="field">
                <label for="q">חיפוש (שם / טיפול / טלפון / קטגוריה / מייל)</label>
                <input id="q" type="search" placeholder="הקלד/י לסינון מהיר..." />
            </div>
            <div class="field">
                <button id="load" class="btn btn-techelet">טען</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">סה״כ רשומות: <b id="count">0</b></div>
            <div class="stat">ימים שונים: <b id="days">0</b></div>
            <div class="stat">קטגוריות שונות: <b id="cats">0</b></div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table id="tbl" class="table">
                <thead>
                    <tr>
                        <th class="nowrap">תאריך</th>
                        <th class="nowrap">שעה</th>
                        <th>שם</th>
                        <th>קטגוריה</th>
                        <th>טיפול</th>
                        <th>טלפון</th>
                        <th class="right">דוא״ל</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Status -->
        <p id="status" class="muted" aria-live="polite" style="margin-top:10px;"></p>
    </main>

    <!-- ===== SCRIPTS (Reader GET) ===== -->
    <script>
        // GET: כתובת ה-Reader (Web App חדש שמשרת רק doGet)
        // TODO: החלף לכתובת ה-exec של פרויקט ה-Reader שלך:
        const EXEC_URL_GET = "https://script.google.com/macros/s/AKfycbzi5IjzUNT-CH_7_xhhK-iVnaXQQxKdJlY20qRmAnTvA-l-7BpHGdliJ5LGZzMdQPU9hQ/exec";

        // מציגים את ה-URL בדשבורד (עוזר לדיבוג)
        document.addEventListener('DOMContentLoaded', () => {
            const ep = document.getElementById('ep');
            ep.textContent = EXEC_URL_GET.replace(/^https?:\/\//, '');
            ep.className = 'badge';
        });

        // ---------- Utilities ----------
        function fmtDate(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }
        function defaultRange() {
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), 1);
            const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            return { from: fmtDate(start), to: fmtDate(end) };
        }

        // בדיקת בריאות ה-Reader – שולח ?action=status עם שבירת קאש
        async function pingStatus() {
            const badge = document.getElementById('ping');
            try {
                const r = await fetch(`${EXEC_URL_GET}?action=status&v=${Date.now()}`, { cache: 'no-store', redirect: 'follow' });
                const t = await r.text();
                badge.textContent = r.ok ? 'Reader OK' : ('HTTP ' + r.status);
                badge.className = 'badge ' + (r.ok ? 'ok' : 'err');
                console.log('STATUS →', t);
            } catch (e) {
                badge.textContent = 'Status error';
                badge.className = 'badge err';
                console.warn('STATUS error', e);
            }
        }

        // קריאת רשומות — GET ל-Reader עם שבירת קאש
        async function fetchBookings(from, to) {
            const url = `${EXEC_URL_GET}?action=bookings&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&v=${Date.now()}`;
            console.log('→ GET', url);
            const res = await fetch(url, { method: 'GET', cache: 'no-store', redirect: 'follow' });
            const text = await res.text();
            console.log('BOOKINGS raw:', text);
            if (!res.ok) throw new Error('GET failed: ' + res.status);
            let data;
            try { data = JSON.parse(text); }
            catch (e) { throw new Error('Bad JSON from server: ' + e.message + ' | body=' + text); }
            return data; // מצופה: { ok:true, items:[...] }
        }

        function render(items) {
            const q = document.getElementById('q').value.trim().toLowerCase();
            const filtered = q ? items.filter(it => {
                const hay = [
                    it.full_name || '',
                    it.service_name || it.service || '',
                    it.phone || '',
                    it.category || '',
                    it.email || ''
                ].join(' ').toLowerCase();
                return hay.includes(q);
            }) : items;

            const tbody = document.querySelector('#tbl tbody');
            tbody.innerHTML = filtered.map(it => {
                const d = it.preferred_date || '';
                const t = it.preferred_time || '';
                const n = it.full_name || '';
                const c = it.category || '';
                const s = it.service_name || it.service || '';
                const p = it.phone || '';
                const e = it.email || '';
                return `<tr>
                      <td class="nowrap">${d}</td>
                      <td class="nowrap">${t}</td>
                      <td>${n}</td>
                      <td>${c}</td>
                      <td>${s}</td>
                      <td>${p}</td>
                      <td class="right">${e}</td>
                    </tr>`;
            }).join('');

            document.getElementById('count').textContent = String(filtered.length);
            const daySet = new Set(filtered.map(it => it.preferred_date || '')); daySet.delete('');
            document.getElementById('days').textContent = String(daySet.size);
            const catSet = new Set(filtered.map(it => it.category || '')); catSet.delete('');
            document.getElementById('cats').textContent = String(catSet.size);
        }

        // זרימת הפעלה — קודם ping, אחר כך Bind, לטעון רק בלחיצה
        document.addEventListener('DOMContentLoaded', async () => {
            await pingStatus();

            const { from, to } = defaultRange();
            document.getElementById('from').value = from;
            document.getElementById('to').value = to;

            document.getElementById('load').addEventListener('click', async () => {
                const s = document.getElementById('status');
                s.textContent = 'טוען נתונים...';
                try {
                    const data = await fetchBookings(
                        document.getElementById('from').value || '',
                        document.getElementById('to').value || ''
                    );
                    if (!data || !data.ok || !Array.isArray(data.items)) {
                        s.textContent = 'שרת החזיר תשובה לא צפויה (ראה Console).';
                        console.warn('Unexpected payload:', data);
                        return;
                    }
                    render(data.items);
                    s.textContent = `נטענו ${data.items.length} רשומות.`;
                } catch (err) {
                    console.warn(err);
                    s.textContent = 'שגיאה בטעינת הנתונים (בדוק doGet?action=bookings / פריסה / הרשאות).';
                }
            });

            // ללא טעינה אוטומטית בעת פתיחת הדף
            // document.getElementById('load').click();
        });
    </script>
</body>
</html>
